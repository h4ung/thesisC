name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (CPU torch + deps)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn pyarrow pyyaml pytest

      - name: Run offline unit tests
        run: |
          # tests that need no MIMIC data: eGFR math, model forward/backward, losses
          pytest tests/ -q

      - name: Lint compile-check
        run: |
          python - <<'PY'
          import pathlib, py_compile
          for p in pathlib.Path('.').rglob('*.py'):
              py_compile.compile(str(p), doraise=True)
          print("all modules compile")
          PY
